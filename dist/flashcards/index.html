<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f5ee"><title>社會小腦袋｜填空閃卡</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="logo" href="./"><span>✦</span> 社會小腦袋<small>填空閃卡</small></a><button id="settings" class="quiet">⚙ 練習設定</button></header>
<main><section class="intro"><div><p class="eyebrow">翰林五上社會 · 第一、第二單元</p><h1>先想一想，再看答案。</h1><p class="muted">一張卡，一個發現。慢慢想，也是在進步。</p></div><div class="stats"><span><b id="knownCount">0</b> / 224<br><small>已熟悉的題目</small></span><span class="star">✧</span></div></section>
<div class="toolbar"><span id="modeTag" class="tag">全部題目</span><span id="topicLabel"></span><button id="shuffle" class="quiet">⇄ 打亂順序</button></div>
<section class="study" id="study"><div class="roundline"><span id="roundLabel">本回合</span><span id="position"></span></div><div class="track"><div id="progress"></div></div>
<article class="card" id="card"><div class="cardtop"><span id="cardFace" class="face">想一想</span><span id="questionId"></span></div><p id="topic" class="topic"></p><div id="sentence" class="sentence"></div><div id="answerNote" class="answer-note" aria-live="polite"></div><div class="cardfoot"><span id="source"></span><span id="blankCount"></span></div></article>
<div id="actions"></div><div class="navigation"><button id="previous" class="quiet">← 上一張</button><span id="hint">點按揭曉，不需要輸入答案</span><button id="next" class="quiet">下一張 →</button></div></section>
<section id="summary" hidden class="summary"></section>
<footer><span>共 224 題 · 306 個填空 · 進度保存在此瀏覽器</span><a href="../">地圖探險</a><p id="storageWarning" role="status"></p><span class="desktop-hint">鍵盤：空白鍵揭曉／收起 · ← → 換題</span></footer></main>
<dialog id="preferences"><form id="prefsForm"><div class="dialog-head"><div><p class="eyebrow">選擇今天的練習</p><h2>一步一步，把觀念練熟。</h2></div><button type="button" class="close" id="closeSettings" aria-label="關閉設定">✕</button></div><label>單元<select id="unitSelect"><option value="all">全部範圍</option><option value="1">第一單元 臺灣的位置與先民足跡</option><option value="2">第二單元 臺灣登上國際舞臺</option><option value="extra">補充閱讀</option><option value="mixed">跨課整合</option></select></label><label>主題<select id="topicSelect"></select></label><div class="formgrid"><label>練習題目<select id="deckSelect"><option value="all">全部題目</option><option value="new">還沒標記的題目</option><option value="review">再練習的題目</option><option value="known">已熟悉的題目</option></select></label><label>每回合張數<select id="sizeSelect"><option value="10">10 張</option><option value="20">20 張</option><option value="all">全部</option></select></label></div><label class="check"><input type="checkbox" id="randomSelect"> 隨機出題</label><p id="filterCount" class="muted"></p><button class="primary" type="submit">開始這一回合 →</button><p class="small">更換設定會開始新回合；已熟悉與再練習的紀錄都會保留。</p></form><button id="reset" class="reset">清除所有閃卡學習紀錄</button></dialog>
<script src="questions.js"></script><script src="app.js"></script></body></html>
